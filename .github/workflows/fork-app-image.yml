name: fork-app-image

# Fork-only and temporary: builds the app image from the stacked Lark feature branch for our own deployment.
# It lives on its own branch so it never reaches the feature branch or an upstream pull request.
# Push to fork-ci (or re-run the latest run) to rebuild from the current feature branch head.
on:
  push:
    branches: [fork-ci]

permissions:
  contents: read

jobs:
  build:
    name: Build app image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feat/lark-typing-reaction
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        run: |
          set -euo pipefail
          # Image names must be lowercase; the repository owner is not.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/compose/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.source.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=fork-app-amd64
          cache-to: type=gha,mode=max,scope=fork-app-amd64
          provenance: false
          sbom: false
      # Before any tag points at it: the untagged digest is unreachable without this run's output.
      - name: Check the app image ships no credentials
        env:
          IMAGE: ${{ steps.source.outputs.image }}@${{ steps.build.outputs.digest }}
        run: bash infra/compose/check-image.sh "$IMAGE" linux/amd64
      - name: Tag the checked image
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.source.outputs.sha }}
        run: docker buildx imagetools create -t "$IMAGE:lark-fork" -t "$IMAGE:sha-$SHA" "$IMAGE@$DIGEST"
